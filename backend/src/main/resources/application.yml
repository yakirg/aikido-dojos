server:
  port: ${PORT:8090}
spring:
  web:
    resources:
      static-locations: file:${FRONTEND_DIST:frontend/dist/},classpath:/static/
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/dojos;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE:false}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
